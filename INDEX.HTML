<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Registration</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f4f3ff;
      background: radial-gradient(circle at top right, #37265f, #11111d 55%);
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(100%, 430px);
      padding: 36px;
      border: 1px solid #39364e;
      border-radius: 20px;
      background: #1b1a2a;
      box-shadow: 0 20px 60px #0006;
    }

    .logo {
      margin: 0 0 8px;
      color: #b7ff5a;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 { margin: 0; font-size: 30px; }
    .intro { margin: 10px 0 26px; color: #aaa8bd; line-height: 1.5; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #424055;
      border-radius: 8px;
      background: #12121e;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #b7ff5a;
      border-color: transparent;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 18px 0;
      color: #c3c1d0;
      font-size: 13px;
    }

    .terms input { width: auto; margin-top: 2px; accent-color: #b7ff5a; }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #b7ff5a;
      color: #17191a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #c9ff83; }

    #message {
      min-height: 20px;
      margin: 14px 0 0;
      text-align: center;
      font-size: 14px;
    }

    .error { color: #ff8291; }
    .success { color: #b7ff5a; }

    .note {
      margin: 20px 0 0;
      color: #9290a5;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="logo">PIXEL ARENA</p>
    <h1>Create your player account</h1>
    <p class="intro">Join the game, choose your player name, and get ready to play.</p>

    <form id="registrationForm">
      <label for="username">Player name</label>
      <input id="username" name="username" type="text"
             minlength="3" maxlength="20" placeholder="Choose a player name" required />

      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
             placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             minlength="8" placeholder="At least 8 characters" required />

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password"
             placeholder="Enter your password again" required />

      <label class="terms">
        <input id="terms" type="checkbox" required />
        <span>I agree to the game’s community rules and terms.</span>
      </label>

      <button type="submit">Create Account</button>
      <p id="message" aria-live="polite"></p>
    </form>

    <p class="note">Demo page only. Connect a secure backend to create real accounts.</p>
  </main>

  <script>
    const form = document.getElementById("registrationForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      message.className = "";

      if (!form.reportValidity()) return;

      const username = form.elements.username.value.trim();
      const password = form.elements.password.value;
      const confirmPassword = form.elements.confirmPassword.value;

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.className = "error";
        form.elements.confirmPassword.focus();
        return;
      }

      message.textContent = `Welcome, ${username}! This is a demo; no account was created.`;
      message.className = "success";
      form.reset();
    });
  </script>
</body>
</html>
